<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cyr — сервер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--card:#e4ecff;--ink:#1b2767;--sub:#4b5b9e;--shd:rgba(28,48,140,.38);--shl:rgba(255,255,255,.7);--ih:rgba(255,255,255,.7);--id:rgba(70,95,190,.25);--bg:#7ea6ff;
--raise:8px 10px 22px var(--shd),-6px -6px 16px var(--shl),inset -6px -6px 12px var(--id),inset 6px 6px 12px var(--ih);
--raise-s:4px 5px 10px var(--shd),-3px -3px 8px var(--shl),inset -3px -3px 6px var(--id),inset 3px 3px 6px var(--ih);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#34458f;--ink:#f0f4ff;--sub:#c3d0ff;--shd:rgba(5,12,50,.55);--shl:rgba(150,175,255,.28);--ih:rgba(190,205,255,.25);--id:rgba(0,0,40,.4)}}
:root[data-theme="dark"]{--card:#34458f;--ink:#f0f4ff;--sub:#c3d0ff;--shd:rgba(5,12,50,.55);--shl:rgba(150,175,255,.28);--ih:rgba(190,205,255,.25);--id:rgba(0,0,40,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 "Nunito","Varela Round","SF Pro Rounded","Segoe UI",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#menu{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top,0px));width:min(224px,calc(100vw - 24px));padding:10px 12px;border-radius:24px;background:var(--card);color:var(--ink);box-shadow:var(--raise)}
.mh{display:flex;align-items:center;gap:8px}
.mt{flex:1;min-width:0}
#name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meta{color:var(--sub);font-size:12px}
.ib{flex:none;width:32px;height:32px;border:0;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:var(--raise-s)}
.ib svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}
#mb{margin-top:8px}
.gps{flex:1 1 100%;font-size:11px;color:var(--sub);overflow-wrap:anywhere}
#gp[aria-pressed="true"]{color:#1f9d55}
/* окно «Навести порядок»: план переноса файлов из корня и подтверждение */
.td{position:fixed;inset:0;z-index:25;display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(10,16,48,.45);box-sizing:border-box}
.td[hidden]{display:none}
.tdb{width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:24px;background:var(--card);color:var(--ink);box-shadow:var(--raise);box-sizing:border-box}
.tdb h2{margin:0;font-size:17px;font-weight:800}
#tdn{font-size:12px;color:var(--sub)}
#tdl{flex:1;min-height:80px;overflow:auto;margin:0;padding:10px 12px;border-radius:14px;background:#0b0f16;color:#d6e0f5;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
#tdl .g{color:#8fd8ff;font-weight:700}#tdl .k{color:#8a93a6}
.tdf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tdf label{flex:1 1 100%;font-size:12px;display:flex;align-items:center;gap:6px}
#tds{flex:1 1 100%;font-size:12px;color:var(--sub);min-height:16px}
#tdgo{background:#2f6bff;color:#fff}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.row label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.sw{width:24px;height:24px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:3px 4px 7px var(--shd),-2px -2px 5px var(--shl),inset -3px -3px 5px rgba(0,0,0,.16),inset 3px 3px 5px rgba(255,255,255,.55)}
.btn{background:var(--card);color:var(--ink);border:0;border-radius:999px;padding:6px 12px;font:inherit;font-weight:800;font-size:12px;cursor:pointer;box-shadow:var(--raise-s)}
.sw:disabled,.btn:disabled,input:disabled{opacity:.4;cursor:default}
select{width:100%;border:0;border-radius:999px;padding:7px 12px;font:inherit;font-weight:800;font-size:12px;color:var(--ink);background:var(--card);box-shadow:var(--raise-s)}
input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:30px;padding:4px;border:0;border-radius:50%;background:var(--card);box-shadow:var(--raise-s)}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
.chl{position:fixed;left:0;top:0;pointer-events:none;color:#eef2ff;font:800 10px/1.1 "Nunito",system-ui,sans-serif;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000,0 0 3px #000;opacity:0}
.lg{font-size:12px;display:flex;align-items:center;gap:7px;margin:3px 0}
.lg i{flex:none;width:12px;height:12px;border-radius:50%;box-shadow:inset -2px -2px 4px rgba(0,0,0,.2),inset 2px 2px 4px rgba(255,255,255,.6)}
/* малярный скотч: обёртка .tape ставится матрицей по плоскости ящика, .tp — сам кусок ленты */
.tape{position:fixed;left:0;top:0;width:100px;height:28px;transform-origin:0 0;pointer-events:none;filter:drop-shadow(0 1px 1.5px rgba(60,45,0,.35))}
.tp{width:100%;height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:0 6px;white-space:nowrap;overflow:hidden;color:rgba(59,52,18,.85);font:700 19px/1 "Caveat","Comic Sans MS","Segoe Print",cursive;letter-spacing:.02em;
background:repeating-linear-gradient(90deg,rgba(150,120,20,.07) 0 1px,transparent 1px 3px),linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%,rgba(120,90,0,.06)),#f8eeb0;
clip-path:polygon(0 0,100% 0,98% 12%,100% 25%,98% 37%,100% 50%,98% 62%,100% 75%,98% 87%,100% 100%,0 100%,2% 88%,0 75%,2% 63%,0 50%,2% 37%,0 25%,2% 13%)}
/* кабель и виртуальный планшет с сайтом репозитория */
#cb{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;visibility:hidden}
.tab{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100vw - 24px));height:min(46vh,520px);z-index:6;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:26px;background:#14161b;box-shadow:var(--raise);transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.tab.off{transform:translateY(130%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
.tab::before{content:"";position:absolute;top:-10px;left:75%;width:30px;height:12px;margin-left:-15px;border-radius:5px 5px 0 0;background:#2b2e36}
.tb{display:flex;align-items:center;gap:6px;color:#cfd5e6;font-size:12px}
#tu{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#23262d;border-radius:999px;padding:7px 12px}
.tb button{flex:none;width:30px;height:30px;border:0;border-radius:50%;background:#23262d;color:#e6ebff;font:inherit;font-size:15px;cursor:pointer}
.ts{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:#fff}
#fr{width:100%;height:100%;border:0;display:block;background:#fff}
.tn{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:#444;background:#f3f5fb}
.tn[hidden]{display:none}
.fs #c,.fs #labels,.fs #menu,.fs #cb{display:none}
.fs .tab{inset:0;width:auto;height:auto;border-radius:0;padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px));transform:none;box-shadow:none}
.fs .tab::before{display:none}
/* монитор на стенде (текст файла, наклеен на экран 3D-монитора) и полноэкранный редактор */
.mon{position:fixed;left:0;top:0;width:300px;height:170px;transform-origin:0 0;pointer-events:none;overflow:hidden;box-sizing:border-box;padding:8px 10px;background:#0b1220;color:#9fe6b0;font:11px/1.3 ui-monospace,Menlo,Consolas,monospace;white-space:pre;opacity:0}
.mon b{display:block;color:#cfe0ff;margin-bottom:4px}
.ed{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#05070b;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}
.ed[hidden]{display:none}
.eh,.ef{display:flex;align-items:center;gap:8px;padding:8px 10px;color:#cfd5e6;font-size:12px;background:#0e1219}
#en{font-weight:800;flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#es{flex:1;min-width:0;color:#8fa0c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eh button,.ef button{border:0;border-radius:999px;padding:7px 14px;background:#23304f;color:#e6ebff;font:inherit;font-weight:800;cursor:pointer}
#sv{background:#2f6bff}
.ef button:disabled{opacity:.5}
#ea{flex:1;min-height:0;width:100%;box-sizing:border-box;resize:none;border:0;outline:0;padding:12px;background:#0b0f16;color:#d6e0f5;font:16px/1.5 ui-monospace,Menlo,Consolas,monospace;tab-size:2;white-space:pre;overflow:auto}
#ev{flex:1;min-height:0;display:grid;place-items:center;background:#0b0f16;overflow:auto}
#ev[hidden]{display:none}
#ev>*{max-width:100%;max-height:100%}
#ec{flex:1;min-width:0;border:0;border-radius:999px;padding:8px 12px;background:#161c28;color:#d6e0f5;font:16px/1.2 inherit}
.edm #c,.edm #labels,.edm #menu,.edm #cb,.edm .mon{display:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #4f6cff;outline-offset:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="mon" class="mon" aria-hidden="true"><b id="mn"></b><span id="mt"></span></div>
<svg id="cb" aria-hidden="true"><path id="cpth" fill="none" stroke="#15161a" stroke-width="5" stroke-linecap="round" style="filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))"/><circle id="cpl" r="6" fill="#23262d" stroke="#aab2c5" stroke-width="2"/></svg>
<div id="menu">
<div class="mh">
<div class="mt"><div id="name"></div><div id="meta"></div></div>
<button id="cl" class="ib" hidden aria-label="Закрыть ящик"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
<button id="tg" class="ib" aria-label="Меню" aria-expanded="false"><svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button>
</div>
<div id="mb" hidden>
<div class="row"><select id="srv" aria-label="Сервер (репозиторий)"></select></div>
<div class="row" id="pgr" hidden><button id="pp" class="btn" aria-label="Назад">‹</button><span id="pl"></span><button id="pn" class="btn" aria-label="Дальше">›</button></div>
<div class="row" id="lvr" hidden><button id="lp" class="btn" aria-label="Ящик наружу">◂</button><span id="ll"></span><button id="ln" class="btn" aria-label="Ящик внутри ящика">▸</button></div>
<div class="row"><button id="pu" class="btn" disabled>Вытащить и править</button></div>
<div class="row"><button id="tb" class="btn">Планшет</button></div>
<div class="row"><button id="tdy" class="btn">Навести порядок</button></div>
<div class="row"><button id="gp" class="btn" aria-pressed="false">Включить WebGPU</button><span id="gps" class="gps"></span></div>
<div class="row" id="sw"></div>
<div class="row"><label>свой <input type="color" id="cc" value="#ffa51a" disabled></label>
<button id="rs" class="btn" disabled>Сбросить</button></div>
<div class="row"><label>Фон <input type="color" id="bg" value="#7ea6ff"></label><button id="lo" class="btn">Выйти</button></div>
<div class="row" style="display:block">
<div class="lg"><i style="background:#ffa51a"></i>Процессор: скрипты (до 4)</div>
<div class="lg"><i style="background:#6c6f76"></i>RTX 5080: html, css (до 8)</div>
<div class="lg"><i style="background:#ffe3d6"></i>SSD: фото, видео, аудио (до 12)</div>
<div class="lg"><i style="background:#c8ced8"></i>SATA: .md и медиа из подпапок — открой, внутри чипы (до 12)</div></div>
</div>
</div>
<div id="tab" class="tab off">
<div class="tb"><span id="tu"></span><button id="tr" aria-label="Обновить">↻</button><button id="tf" aria-label="Во весь экран">⤢</button><button id="tx" aria-label="Отключить планшет">✕</button></div>
<div class="ts"><iframe id="fr" title="Сайт репозитория" sandbox="allow-scripts allow-forms allow-popups allow-modals" referrerpolicy="no-referrer"></iframe><div id="tn" class="tn" hidden></div></div>
</div>
<div id="td" class="td" hidden role="dialog" aria-modal="true" aria-labelledby="tdh">
<div class="tdb">
<h2 id="tdh">Навести порядок</h2>
<div id="tdn"></div>
<pre id="tdl"></pre>
<div class="tdf"><label><input type="checkbox" id="tdk" checked> Исправить ссылки на перенесённые файлы (html, css, js, md, svg, json, yml)</label>
<label id="tdjl" hidden><input type="checkbox" id="tdj" checked> Jekyll: сохранить адреса страниц (permalink в перенесённых .md)</label>
<button id="tdx" class="btn">Отмена</button><button id="tdgo" class="btn">Разложить по папкам</button>
<div id="tds" role="status"></div></div>
</div>
</div>
<div id="ed" class="ed" hidden>
<div class="eh"><span id="en"></span><span id="es"></span><button id="ex">Закрыть</button></div>
<textarea id="ea" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Код файла"></textarea>
<div id="ev" hidden></div>
<div class="ef"><input id="ec" placeholder="Сообщение коммита" aria-label="Сообщение коммита"><button id="sv">Сохранить</button></div>
</div>
<script src="webgpu.js"></script>
<script>
(async()=>{
const $=id=>document.getElementById(id);
const TOK=sessionStorage.getItem('cyr_token');
if(!TOK){location.replace('index.html');return;}
let cv=$('c');
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
const toHex=c=>'#'+c.map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');
/* цвет для карты нажатий: 16-битный номер объекта в красном и зелёном каналах */
const pc=id=>[(id&255)/255,(id>>8)/255,0];

/* ---- данные: сервер (репо) → ящики (папки) → детали (файлы) ----
   part: {o:центр, s:размер, f:множитель цвета детали | c:фиксированный цвет, k:1 — цилиндр вдоль Z} */
const CHR='#e3e8f2',DK='#16181c',FAN='#23262d',GRY='#9aa2b2',BLK='#0b0c0e';
const PNL='#101114',BRK='#3c3f45',TXT='#c9ced8';
/* RTX 5080 Founders Edition стоит на ребре (вид «||||»): PCIe-контакты внизу, планка с портами к фасаду (+Z),
   большие грани с двумя чёрными рёбристыми окнами смотрят в стороны (±X), сверху «GEFORCE RTX» и вентиляционный вырез.
   Размеры модели: толщина 0.36 (X), высота 0.9 (Y), длина 2.0 (Z). */
const gpuParts=[{o:[0,.46,0],s:[.36,.88,2],f:1}];
for(const sx of[-1,1])gpuParts.push(
 {o:[sx*.185,.46,.55],s:[.04,.66,.72],c:PNL},
 {o:[sx*.185,.46,-.55],s:[.04,.66,.72],c:PNL},
 {o:[sx*.19,.46,0],s:[.012,.28,.05],c:TXT});
gpuParts.push(
 {o:[0,.9,-.1],s:[.1,.012,1.05],c:TXT},
 {o:[0,.9,-.5],s:[.22,.04,.3],c:BLK},
 {o:[-.07,.9,.3],s:[.025,.03,.6],c:BLK},{o:[.07,.9,.3],s:[.025,.03,.6],c:BLK},
 {o:[0,.46,1.03],s:[.46,.9,.04],c:BRK},
 {o:[0,.18,1.065],s:[.17,.09,.03],c:BLK},{o:[0,.36,1.065],s:[.2,.09,.03],c:BLK},
 {o:[0,.54,1.065],s:[.2,.09,.03],c:BLK},{o:[0,.72,1.065],s:[.2,.09,.03],c:BLK},
 {o:[0,.03,.3],s:[.05,.06,.9],c:'#ffd98a'});
const TYPES={
 cpu:{name:'Процессор',col:'#ffa51a',parts:[
  {o:[0,.04,0],s:[1.05,.08,1.05],f:.4},{o:[0,.14,0],s:[.95,.2,.95],f:1},{o:[0,.27,0],s:[.55,.06,.55],f:.55}]},
 gpu:{name:'RTX 5080',col:'#6c6f76',parts:gpuParts},
 ssd:{name:'SSD',col:'#ffe3d6',parts:[
  {o:[0,.09,0],s:[1.7,.18,.9],f:1},{o:[.1,.2,0],s:[1,.03,.55],f:.5},{o:[-.95,.06,0],s:[.2,.12,.7],c:'#ffd98a'}]},
 /* 2.5" SATA-диск (длина 1.0 по X, глубина 0.7 по Z): корпус, плата внутри, крышка (lid — уезжает при открытии), разъёмы SATA сбоку */
 sata:{name:'SATA-диск',col:'#c8ced8',parts:[
  {o:[0,.035,0],s:[1,.07,.7],f:.85},{o:[0,.077,0],s:[.92,.014,.62],c:'#1f6b3a'},
  {o:[-.42,.088,.2],s:[.06,.01,.16],c:'#ffd98a'},
  {o:[0,.1,0],s:[1,.03,.7],f:1,lid:1},{o:[-.04,.117,0],s:[.62,.006,.46],c:'#262a33',lid:1},{o:[-.04,.121,-.12],s:[.4,.004,.05],c:TXT,lid:1},
  {o:[-.505,.05,.1],s:[.02,.045,.24],c:BLK},{o:[-.505,.05,-.2],s:[.02,.045,.13],c:BLK}]},
 /* чип памяти = один .md-файл: корпус, золотые выводы по двум сторонам, метка первого вывода */
 chip:{name:'Чип (.md)',col:'#2a2d35',parts:[
  {o:[0,.065,0],s:[.8,.1,.56],f:1},{o:[0,.025,.3],s:[.72,.03,.06],c:'#ffd98a'},{o:[0,.025,-.3],s:[.72,.03,.06],c:'#ffd98a'},
  {o:[-.3,.117,-.17],s:[.07,.006,.07],c:GRY}]}
};
/* ребристая решётка: повторяем деталь p по смещениям p.x вдоль X */
for(const t in TYPES)TYPES[t].parts=TYPES[t].parts.flatMap(p=>p.x?p.x.map(dx=>({...p,x:0,o:[p.o[0]+dx-.0,p.o[1],p.o[2]]})):[p]);
/* расширение файла → тип детали. Медиа (SSD) — все форматы из MIME, чтобы новые (avif, jxl, heif…) не пропадали молча */
const MEDIA=['png','apng','jpg','jpeg','jfif','pjpeg','pjp','gif','webp','avif','jxl','heic','heif','svg','bmp','ico','cur','tif','tiff','mp4','m4v','mov','webm','mkv','avi','ogv','mpg','mpeg','3gp','mp3','wav','ogg','oga','opus','flac','m4a','aac','weba','aif','aiff'];
const EXT={};
[['cpu','py js mjs cjs ts jsx tsx sh bash zsh bat ps1 rb php lua go rs java c cpp cs kt swift'],
 ['gpu','html htm css scss'],
 ['sata','md markdown mdx'],
 ['ssd',MEDIA.join(' ')]]
 .forEach(([t,s])=>s.split(' ').forEach(e=>EXT[e]=t));
const MIME={png:'image/png',apng:'image/apng',jpg:'image/jpeg',jpeg:'image/jpeg',jfif:'image/jpeg',pjpeg:'image/jpeg',pjp:'image/jpeg',gif:'image/gif',webp:'image/webp',avif:'image/avif',jxl:'image/jxl',heic:'image/heic',heif:'image/heif',svg:'image/svg+xml',bmp:'image/bmp',ico:'image/x-icon',cur:'image/x-icon',tif:'image/tiff',tiff:'image/tiff',
 mp4:'video/mp4',m4v:'video/mp4',mov:'video/quicktime',webm:'video/webm',mkv:'video/x-matroska',avi:'video/x-msvideo',ogv:'video/ogg',mpg:'video/mpeg',mpeg:'video/mpeg','3gp':'video/3gpp',
 mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg',flac:'audio/flac',m4a:'audio/mp4',aac:'audio/aac',weba:'audio/webm',aif:'audio/aiff',aiff:'audio/aiff'};
const ext=f=>f.split('.').pop().toLowerCase();

  cb.style.visibility='visible';
 }else cb.style.visibility='hidden';
 /* экран монитора: начало файла, пока деталь лежит на столе */

 mon.style.transform=mat(proj(STX-1.5,5.35,-.77),proj(STX+1.5,5.35,-.77),proj(STX-1.5,3.65,-.77),300,170);
 mon.style.opacity=on?1:0;
 /* подписи чипов открытого SATA-диска */
 const so=sOpen>=0&&outId<0?items[sOpen]:null;let li=0;

  if(it.type!=='chip'||it.par!==sOpen||li>=chl.length)continue;
  const q=xf(it);if(!q)continue;
  const w=.8*q.c,y=q.b[1]+.12*q.c,a=proj(q.b[0]-w/2,y,q.b[2]),bb=proj(q.b[0]+w/2,y,q.b[2]),el=chl[li++],t=it.media?it.name:it.name.replace(/\.(md|markdown|mdx)$/i,'');
  if(el.textContent!==t)el.textContent=t;
  el.style.width=Math.max(24,bb[0]-a[0])+'px';el.style.transform='translate('+a[0]+'px,'+(a[1]-6)+'px)';el.style.opacity=1;
 }

/* ---- GitHub ---- */
const gh=async(u,o={})=>{
 const r=await fetch('https://api.github.com'+u,{method:o.method||'GET',cache:o.cache||'default',headers:Object.assign({Authorization:'Bearer '+TOK,Accept:o.accept||'application/vnd.github+json'},o.body?{'Content-Type':'application/json'}:{}),body:o.body?JSON.stringify(o.body):undefined});
 if(r.status===401){sessionStorage.removeItem('cyr_token');location.replace('index.html');throw new Error('401');}
 if(!r.ok){const e=new Error(r.status);try{e.msg=(await r.json()).message;}catch(_){}throw e;}
 return o.blob?r.blob():r.json();
};
const api=gh;
const leaveOk=()=>!(F&&F.dirty)||confirm('Есть несохранённые изменения. Продолжить без сохранения?');
function build(){
 if(edOn){edOn=false;$('ed').hidden=true;document.body.classList.remove('edm');}
 outId=-1;F=null;lv=0;sOpen=-1;showMon();
 CELLS=cellsAll.slice(pg*PER,(pg+1)*PER);
 const nc=Math.max(1,Math.ceil(CELLS.length/4));
 if(nc!==ncol){ncol=nc;frame=mkFrame(nc);}
 items=[];
 dr.forEach((d,i)=>{d.on=i<CELLS.length;d.n=d.on?CELLS[i].n:'';d.a=0;d.nl.fill(0);d.levels=1;d.shown=0;});
 CELLS.forEach((c,ci)=>{
  /* медиа прямо в папке — SSD; медиа из подпапки (images/covers/…) — чипы в SATA-диске этой подпапки; .md — чипы в своём SATA-диске */
  const by={cpu:[],gpu:[],ssd:[],sata:[]},d=dr[ci],sub=new Map(),pre=c.n==='/'?'':c.n;
  c.f.forEach(f=>{
   const t=EXT[ext(f)],rel=f.slice(pre.length),k=rel.indexOf('/');
   if(t==='ssd'&&k>0){const sn=rel.slice(0,k+1);if(!sub.has(sn))sub.set(sn,[]);sub.get(sn).push(f);}
   else by[t].push(f);
  });
  /* SATA-диски по 12 чипов: заполнился — рядом встаёт новый диск */
  const disks=[],chunk=(lab,fl,media)=>{const n=Math.ceil(fl.length/CAP.sata);for(let j=0;j<n;j++)disks.push({lab,fl:fl.slice(j*CAP.sata,(j+1)*CAP.sata),media,no:n>1?(j+1)+'/'+n:''});};
  chunk('.md',by.sata,false);
  [...sub].sort(([a],[b])=>a.localeCompare(b)).forEach(([sn,fl])=>chunk(sn,fl,true));
  /* раскладка по уровням: место в лотке кончилось — автоматически появляется ящик в ящике */
  const Q={dk:disks.slice(),cpu:by.cpu.slice(),gpu:by.gpu.slice(),ssd:by.ssd.slice()},plan=[];
  while((Q.dk.length||Q.cpu.length||Q.gpu.length||Q.ssd.length)&&plan.length<MAXLV){
   const dk=Q.dk.splice(0,BACK);
   plan.push({dk,cpu:Q.cpu.splice(0,BACK-dk.length),gpu:Q.gpu.splice(0,CAP.gpu),ssd:Q.ssd.splice(0,CAP.ssd)});
  }
  d.levels=Math.max(1,plan.length);
  const mk=(t,path,L,q,x)=>{const it=Object.assign({i:items.length,name:path.split('/').pop(),path,type:t,cell:ci,lvl:L,rot:t==='ssd',sc:q.sc,lx:q.x,lz:q.z,y:0,ps:0,pt:0,op:0,h:null,hc:1,base:TYPES[t].col},x);it.col=hex(it.base);items.push(it);return it;};
  plan.forEach((P,L)=>{
   const back=[...P.dk.map(k=>({k})),...P.cpu.map(f=>({f}))];
   fit(back.length,ZN.cpu,FP.cpu).forEach((q,j)=>{
    const{k,f}=back[j];
    if(f){mk('cpu',f,L,q);d.shown++;return;}
    const disk=mk('sata',c.n,L,q,{name:'SATA · '+(k.media?k.lab+' · '+k.fl.length:k.fl.length+' .md')+(k.no?' · '+k.no:''),n:k.fl.length,lab:k.lab+(k.no?' '+k.no:''),media:k.media});
    fit(k.fl.length,BOARD,FP.chip).forEach((q2,j2)=>{mk('chip',k.fl[j2],L,q2,{par:disk.i,media:k.media,base:k.media?'#8a5566':TYPES.chip.col});d.shown++;});
   });
   fit(P.gpu.length,ZN.gpu,FP.gpu,true).forEach((q,j)=>{mk('gpu',P.gpu[j],L,q);d.shown++;});
   fit(P.ssd.length,ZN.ssd,FP.ssd).forEach((q,j)=>{mk('ssd',P.ssd[j],L,q);d.shown++;});
  });
 });
 dr.forEach((d,i)=>{tapes[i].firstChild.textContent=d.n+(d.levels>1?' ×'+d.levels:'');});
 od=-1;sel=-1;
 const pages=Math.ceil(cellsAll.length/PER);
 $('pgr').hidden=pages<2;$('pl').textContent=(pg+1)+' / '+pages;$('pp').disabled=pg<1;$('pn').disabled=pg>=pages-1;
 ui();
}
/* дерево файлов → ящики (папки верхнего уровня) */
function cellsOf(tree){
 const m=new Map();
 for(const e of tree){
  if(e.type!=='blob'||!EXT[ext(e.path)])continue;
  const s=e.path.indexOf('/'),k=s<0?'/':e.path.slice(0,s)+'/';
  if(!m.has(k))m.set(k,[]);
  m.get(k).push(e.path);
 }
 return[...m].sort(([a],[b])=>a==='/'?-1:b==='/'?1:a.localeCompare(b)).map(([n,f])=>({n,f}));
}
let head='',tree=[],pend=null,polling=false,tidyOn=false;
async function loadServer(i){
 cur=i;pg=0;cellsAll=[];tree=[];head='';pend=null;msg='Загружаю…';build();setSite();
 const r=repos[i];
 try{
  const b=await api('/repos/'+r.full_name+'/branches/'+encodeURIComponent(r.default_branch),{cache:'no-cache'});
  const t=await api('/repos/'+r.full_name+'/git/trees/'+b.commit.sha+'?recursive=1');
  if(cur!==i)return;
  head=b.commit.sha;tree=t.tree;cellsAll=cellsOf(tree);
  msg=cellsAll.length?'Ящиков: '+cellsAll.length+(t.truncated?' (список файлов неполный)':''):'Нет подходящих файлов';
 }catch(e){msg=e.message==='409'?'Репозиторий пуст':'Не удалось загрузить ('+e.message+')';}
 if(cur===i)build();
}
/* автообновление: раз в 20 с (и при возврате на вкладку) проверяем последний коммит ветки.
   Появились новые файлы — ящики, диски и вложенные ящики пересобираются сами; открытый ящик остаётся открытым */
async function poll(){
 const i=cur,r=repos[i];
 if(!r||!head||polling||document.hidden)return;
 polling=true;
 try{
  const b=await api('/repos/'+r.full_name+'/branches/'+encodeURIComponent(r.default_branch),{cache:'no-cache'});
  if(cur===i&&b.commit.sha!==head){
   const t=await api('/repos/'+r.full_name+'/git/trees/'+b.commit.sha+'?recursive=1');
   if(cur===i){head=b.commit.sha;tree=t.tree;pend=cellsOf(tree);applyPend();}
  }
 }catch(e){}

}
function applyPend(){
 if(!pend||outId>=0||edOn||tidyOn)return;
 const was=JSON.stringify(cellsAll),odn=od>=0&&CELLS[od]?CELLS[od].n:'',lv0=lv,n0=cellsAll.reduce((a,c)=>a+c.f.length,0);
 cellsAll=pend;pend=null;
 if(JSON.stringify(cellsAll)===was)return;
 const n1=cellsAll.reduce((a,c)=>a+c.f.length,0);
 msg='Обновлено: '+(n1>=n0?'+'+(n1-n0):'−'+(n0-n1))+' файл(ов), ящиков: '+cellsAll.length;
 build();
 const k=CELLS.findIndex(c=>c.n===odn);
 if(k>=0){od=k;lv=Math.min(lv0,dr[k].levels-1);}
 ui();
}
setInterval(poll,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
async function loadRepos(){
 msg='Загружаю репозитории…';ui();
 try{
  for(let p=1;p<=10;p++){
   const r=await api('/user/repos?per_page=100&sort=pushed&page='+p);
   repos.push(...r);if(r.length<100)break;
  }
 }catch(e){msg='Не удалось загрузить репозитории ('+e.message+')';ui();return;}
 $('srv').innerHTML='';
 repos.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r.full_name;$('srv').appendChild(o);});
 if(repos.length)loadServer(0);else{msg='Репозиториев нет';ui();}
}

/* ---- стенд и редактор: деталь вынимается из ящика, лежит на столе, файл правится на мониторе и коммитится в GitHub ---- */
const ea=$('ea'),ev=$('ev');
function showMon(){
 $('mn').textContent=F?F.it.name:'';
 $('mt').textContent=!F?'':F.err?F.err:!F.ok?'загрузка…':F.media?'[медиафайл — просмотр]':F.text.split('\n').slice(0,10).map(s=>s.slice(0,44)).join('\n');
}
async function loadFile(it){
 const r=repos[cur],my=F={it,path:it.path,ok:false,dirty:false,text:'',sha:'',crlf:false,media:EXT[ext(it.path)]==='ssd',url:'',mime:'',err:''};
 showMon();
 try{
  const q='/repos/'+r.full_name+'/contents/'+encodeURI(it.path)+'?ref='+encodeURIComponent(r.default_branch);
  if(my.media){
   const b=await gh(q,{accept:'application/vnd.github.raw+json',blob:true});
   my.mime=MIME[ext(it.path)]||'application/octet-stream';my.url=URL.createObjectURL(new Blob([b],{type:my.mime}));
  }else{
   const j=await gh(q);
   if(j.size>1048576||(!j.content&&j.size>0))throw new Error('Файл больше 1 МБ — править нельзя');
   my.sha=j.sha;
   const t=new TextDecoder().decode(Uint8Array.from(atob((j.content||'').replace(/\n/g,'')),c=>c.charCodeAt(0)));
   my.crlf=/\r\n/.test(t);my.text=t.replace(/\r\n/g,'\n');
  }
  my.ok=true;
 }catch(e){my.err=e.msg||e.message;}
 if(F===my){showMon();fillEd();}
}
function fillEd(){
 if(!F||!edOn)return;
 $('en').textContent=F.it.name;ev.textContent='';
 const med=F.media;
 $('ec').hidden=$('sv').hidden=med;
 if(!F.ok){ea.hidden=true;ev.hidden=true;$('es').textContent=F.err?'Ошибка: '+F.err:'Загрузка…';return;}
 ea.hidden=med;ev.hidden=!med;
 if(med){
  const t=F.mime.split('/')[0],el=document.createElement(t==='image'?'img':t==='video'?'video':'audio');
  el.src=F.url;if(t!=='image')el.controls=true;ev.appendChild(el);
  $('es').textContent='Просмотр: медиафайл править нельзя';
 }else{ea.value=F.text;$('es').textContent='Сохранено';}
}
function openEd(){edOn=true;$('ed').hidden=false;document.body.classList.add('edm');fillEd();}
function closeEd(){
 if(F&&F.dirty&&!confirm('Есть несохранённые изменения. Закрыть без сохранения?'))return;
 if(F)F.dirty=false;
 edOn=false;$('ed').hidden=true;document.body.classList.remove('edm');
}
async function save(){
 if(!F||!F.ok||F.media)return;
 const r=repos[cur],my=F,text=ea.value,bytes=new TextEncoder().encode(my.crlf?text.replace(/\n/g,'\r\n'):text);
 let b='';for(let i=0;i<bytes.length;i+=8192)b+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
 $('es').textContent='Сохраняю…';$('sv').disabled=true;
 try{
  const j=await gh('/repos/'+r.full_name+'/contents/'+encodeURI(my.path),{method:'PUT',body:{message:$('ec').value.trim()||'Правка '+my.path+' через cyr',content:btoa(b),sha:my.sha,branch:r.default_branch}});
  my.sha=j.content.sha;my.text=text;my.dirty=false;showMon();
  $('es').textContent='Сохранено — коммит '+(j.commit&&j.commit.sha?j.commit.sha.slice(0,7):'');
 }catch(e){$('es').textContent=(e.message==='409'||e.message==='422')?'Файл на GitHub уже изменился. Закрой и открой заново.':'Ошибка: '+(e.msg||e.message);}
 $('sv').disabled=false;
}
function pull(i){
 if(outId>=0&&!leave())return;
 const it=items[i],q=xf(it);
 if(!q||it.type==='sata')return;
 it.h=q.b;it.hc=q.c;
 it.pt=1;outId=i;od=-1;lv=0;sel=-1;sOpen=-1;edDone=false;
 loadFile(it);ui();
}
function leave(){
 if(outId<0)return true;
 if(F&&F.dirty&&!confirm('Есть несохранённые изменения. Вернуть деталь без сохранения?'))return false;
 if(edOn){edOn=false;$('ed').hidden=true;document.body.classList.remove('edm');}
 const it=items[outId];it.pt=0;od=it.cell;lv=it.lvl;sOpen=it.type==='chip'?it.par:-1;outId=-1;F=null;showMon();ui();return true;
}
ea.oninput=()=>{if(!F)return;F.dirty=ea.value!==F.text;$('es').textContent=F.dirty?'Изменено, не сохранено':'Сохранено';};
ea.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();ea.setRangeText('  ',ea.selectionStart,ea.selectionEnd,'end');ea.oninput();}};
$('ex').onclick=closeEd;
$('sv').onclick=save;
$('pu').onclick=()=>{if(sel>=0)pull(sel);};
$('lp').onclick=()=>{if(lv>0){lv--;sOpen=-1;sel=-1;ui();}};
$('ln').onclick=()=>{if(od>=0&&lv<dr[od].levels-1){lv++;sOpen=-1;sel=-1;ui();}};
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(edOn)closeEd();else if(fs)setFs(false);}
 else if(edOn&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save();}
});

/* ---- ввод ---- */
let down=null;
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,m:0};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
 if(!down)return;
 const dx=e.clientX-down.x;down.m+=Math.abs(dx)+Math.abs(e.clientY-down.y);
 yaw=Math.max(-.9,Math.min(.9,yaw+dx*.008));down.x=e.clientX;down.y=e.clientY;
});
cv.addEventListener('pointerup',e=>{
 if(down&&down.m<6){
  draw(true);
  R.read(Math.floor(e.clientX*dpr),Math.floor(e.clientY*dpr)).then(px=>tap(px[0]+px[1]*256));
 }
 down=null;
});
function tap(id){
 if(id===5){setTab(!tabOn);return;}
 if(id===6){if(outId>=0)openEd();return;}
 if(id>=200&&id<300){
  const k=id-200;
  if(dr[k]&&dr[k].on){od=od===k?-1:k;lv=0;sel=-1;sOpen=-1;if(od>=0&&dr[od].levels>1)menu(true);}
 }
 else if(id>=1000){
  const i=id-1000,it=items[i];
  if(!it)return;
  if(outId===i){openEd();return;}
  /* SATA-диск: тап открывает его (крышка уезжает, видны чипы); по открытому — только снять выбор */
  if(it.type==='sata'){if(sOpen!==i){sOpen=i;od=it.cell;}sel=-1;ui();return;}
  if(sel===i){pull(i);return;}
  sel=i;menu(true);
 }
 else if(id>=100&&id<200){if(sel>=0)sel=-1;else sOpen=-1;}
 else if(sel>=0){sel=-1;}
 else if(sOpen>=0){sOpen=-1;}
 else{od=-1;lv=0;}
 ui();
}

/* ---- меню (левый верхний угол) ---- */
const sw=$('sw'),cc=$('cc'),rs=$('rs'),cl=$('cl'),tg=$('tg'),mb=$('mb');
['#ffa51a','#2fc24a','#ffe3d6','#8de0b7','#ff9fb8','#c3b0ff','#8fd8ff','#ffe58a'].forEach(c=>{

 b.onclick=()=>paint(c);sw.appendChild(b);

function ui(){
 const on=sel>=0,nest=od>=0&&dr[od].levels>1;
 sw.querySelectorAll('button').forEach(b=>b.disabled=!on);cc.disabled=rs.disabled=!on;
 $('pu').disabled=!on;
 $('lvr').hidden=!nest;
 if(nest){$('ll').textContent='ящик в ящике '+(lv+1)+' / '+dr[od].levels;$('lp').disabled=lv<1;$('ln').disabled=lv>=dr[od].levels-1;}
 cl.hidden=od<0&&outId<0;
 cl.setAttribute('aria-label',outId>=0?'Вернуть деталь на место':sOpen>=0?'Закрыть SATA-диск':'Закрыть ящик');
 if(outId>=0){$('name').textContent=items[outId].name;$('meta').textContent='На стенде. Тап по монитору — редактор';}
 else if(on){const it=items[sel];$('name').textContent=it.name;$('meta').textContent=(it.type==='chip'&&it.media?'Чип (медиа)':TYPES[it.type].name)+', ящик '+CELLS[it.cell].n+'. Ещё тап — править';cc.value=toHex(it.col);}
 else if(sOpen>=0){const s2=items[sOpen];$('name').textContent='SATA-диск'+(s2.media?' '+s2.lab:'');$('meta').textContent=(s2.media?'Медиа из '+s2.lab+': ':'Чипов (.md'+(s2.lab!=='.md'?', диск '+s2.lab.slice(4):'')+'): ')+s2.n+', ящик '+CELLS[s2.cell].n+'. Тап по чипу — выбрать';}
 else if(od>=0){const n=CELLS[od].f.length,sh2=dr[od].shown;$('name').textContent=CELLS[od].n;$('meta').textContent='Ящик открыт, файлов: '+n+(sh2<n?' (показано '+sh2+')':'');}
 else{$('name').textContent=repos[cur]?repos[cur].name:'cyr';$('meta').textContent=msg;}
}
tg.onclick=()=>menu(mb.hidden);
cc.oninput=()=>paint(cc.value);
rs.onclick=()=>{if(sel>=0){const it=items[sel];it.col=hex(it.base);cc.value=it.base;}};
cl.onclick=()=>{if(outId>=0){leave();return;}if(sOpen>=0){sOpen=-1;sel=-1;ui();return;}od=-1;lv=0;sel=-1;ui();};
$('bg').oninput=e=>{bg=hex(e.target.value);document.documentElement.style.setProperty('--bg',e.target.value);};

/* ---- «Навести порядок»: файлы из корня раскладываются по папкам и подпапкам по формату (для медиа — по кодеку/контейнеру).
   Всё делается одним коммитом через Git Data API; ссылки на перенесённые файлы в текстовых файлах исправляются. ---- */
/* что остаётся в корне: служебные файлы, страницы сайта и всё, что GitHub/Pages/Jekyll ищут именно там */
const KEEP=/^(readme|license|licence|copying|notice|authors|contributors|changelog|history|contributing|code_of_conduct|security|support|funding|citation)(\.[\w.-]+)?$|^(index|404)\.(html?|md|markdown)$|^(cname|robots\.txt|sitemap\.xml|humans\.txt|ads\.txt|security\.txt|_config(\.[\w-]+)?\.ya?ml|mkdocs\.ya?ml|manifest\.json|.*\.webmanifest|browserconfig\.xml|package(-lock)?\.json|(ts|js)config(\.[\w-]+)?\.json|deno\.jsonc?|vercel\.json|netlify\.toml|firebase\.json|composer\.json|bower\.json|search\.json|favicon\.[\w]+|apple-touch-icon[\w.-]*|(service-?worker|sw|[\w-]+-sw|sw-[\w-]+)\.js)$/i;
const FAM={jpg:'jpeg',jpeg:'jpeg',jfif:'jpeg',pjpeg:'jpeg',pjp:'jpeg',png:'png',apng:'png',heic:'heif',heif:'heif',tif:'tiff',tiff:'tiff',ico:'icons',cur:'icons',
 mp4:'mp4',m4v:'mp4',mpg:'mpeg',mpeg:'mpeg',ogg:'ogg',oga:'ogg',opus:'opus',aif:'aiff',aiff:'aiff',ogv:'ogg'};
const VID='mp4 m4v mov webm mkv avi ogv mpg mpeg 3gp'.split(' '),AUD='mp3 wav ogg oga opus flac m4a aac weba aif aiff'.split(' ');
function tidyDir(name){
 if(KEEP.test(name)||name.startsWith('.'))return null;
 const e=ext(name);if(!name.includes('.'))return null;
 const fam=FAM[e]||e;
 if(EXT[e]==='ssd')return(VID.includes(e)?'video/':AUD.includes(e)?'audio/':'images/')+fam+'/';
 if(/^(md|markdown|mdx)$/.test(e))return'docs/';
 if(/^(css|scss|sass|less)$/.test(e))return'css/';
 if(/^(js|mjs|cjs|jsx)$/.test(e))return'js/';
 if(/^(ts|tsx)$/.test(e))return'ts/';
 if(e==='py')return'python/';
 if(/^(sh|bash|zsh)$/.test(e))return'scripts/shell/';
 if(/^(bat|ps1)$/.test(e))return'scripts/windows/';
 if(EXT[e]==='cpu')return'src/'+e+'/';
 if(/^(csv|tsv)$/.test(e))return'data/'+e+'/'; /* .json в корне не трогаем: их часто грузят по прямому адресу */
 if(/^(pdf|docx?|odt|rtf|xlsx?|ods|pptx?|odp|epub)$/.test(e))return'files/documents/';
 if(/^(zip|7z|rar|tar|gz|tgz|bz2|xz)$/.test(e))return'files/archives/';
 if(/^(woff2?|ttf|otf|eot)$/.test(e))return'fonts/';
 if(e==='wasm')return'wasm/';
 return null; /* html и неизвестное — на месте: html это адреса страниц сайта */
}
function tidyPlan(){
 const have=new Set(tree.filter(e=>e.type==='blob').map(e=>e.path)),moves=[],skip=[];
 for(const e of tree){
  if(e.type!=='blob'||e.path.includes('/'))continue;
  const d=tidyDir(e.path);if(!d)continue;
  const to=d+e.path;
  if(have.has(to)){skip.push(e.path+' (в '+d+' уже есть файл с таким именем)');continue;}
  moves.push({from:e.path,to,e});
 }
 return{moves,skip};
}
const dirOf=p=>p.includes('/')?p.slice(0,p.lastIndexOf('/')+1):'';
function normP(p){const o=[];for(const s of p.split('/')){if(s==='.'||s==='')continue;if(s==='..'){if(!o.length)return null;o.pop();}else o.push(s);}return o.join('/');}
function relP(fromDir,to){
 const a=fromDir.split('/').filter(Boolean),b=to.split('/');let i=0;
 while(i<a.length&&i<b.length-1&&a[i]===b[i])i++;
 return'../'.repeat(a.length-i)+b.slice(i).join('/');
}
const TXF=/\.(html?|css|scss|sass|less|js|mjs|cjs|jsx|ts|tsx|md|markdown|mdx|svg|json|webmanifest|xml|ya?ml)$/i;
/* переписывает ссылки в тексте файла: путь разрешается от старого места файла и пересчитывается от нового */
function relink(text,oldP,newP,map,have,yml){
 const od=dirOf(oldP),nd=dirOf(newP),re=yml?/(["'(=\s:]|^)([^\s"'()<>`{}|\\^\[\]]+\.[a-z0-9]{1,8})(?=[?#"')\s>,;]|$)/gim:/(["'(=]\s*)([^\s"'()<>`{}|\\^\[\]]+\.[a-z0-9]{1,8})(?=[?#"')\s>,;]|$)/gi;
 let n=0;
 const out=text.replace(re,(m,pre,u)=>{
  if(/^[a-z][\w+.-]*:|^\/\//i.test(u))return m;
  const abs=u.startsWith('/'),hit=normP((abs?'':od)+u);
  if(hit==null||!have.has(hit))return m;
  const to=map.get(hit)||hit;
  if(to===hit&&od===nd)return m;
  let v=abs?'/'+to:relP(nd,to);
  if(!abs&&u.startsWith('./')&&!v.startsWith('../'))v='./'+v;
  if(v===u)return m;
  n++;return pre+v;
 });
 return{out,n};
}
const td=$('td'),tdl=$('tdl'),tdn=$('tdn'),tds=$('tds'),tdgo=$('tdgo');
let TP=null;
function esc(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
/* permalink в front matter: страница после переноса в docs/ открывается по старому адресу */
function addPermalink(t,url){
 const nl=/\r\n/.test(t)?'\r\n':'\n';
 if(/^---\r?\n/.test(t)){
  const end=t.indexOf(nl+'---',3);if(end<0)return t;
  if(/^permalink\s*:/m.test(t.slice(0,end)))return t;
  return'---'+nl+'permalink: '+url+t.slice(3);
 }
 return'---'+nl+'permalink: '+url+nl+'---'+nl+t;
}
async function openTidy(){
 if(outId>=0&&!leave())return;
 if(!leaveOk())return;
 const r=repos[cur],i=cur;
 if(!r||!head){msg='Сначала дождись загрузки репозитория';ui();return;}
 TP=tidyPlan();tidyOn=true;td.hidden=false;tds.textContent='';$('tdx').textContent='Отмена';$('tdx').disabled=false;
 $('tdh').textContent='Навести порядок — '+r.name;
 const g=new Map();TP.moves.forEach(m=>{const d=dirOf(m.to);if(!g.has(d))g.set(d,[]);g.get(d).push(m.from);});
 TP.jek=tree.some(e=>/^_config\.ya?ml$/.test(e.path));
 $('tdjl').hidden=!(TP.jek&&TP.moves.some(m=>/\.(md|markdown)$/i.test(m.from)));
 TP.list=[...g].sort(([a],[b])=>a.localeCompare(b)).map(([d,f])=>'<span class="g">'+esc(d)+'</span>\n'+f.map(x=>'  '+esc(x)).join('\n')).join('\n')+(TP.skip.length?'\n<span class="k">пропущено:\n'+TP.skip.map(x=>'  '+esc(x)).join('\n')+'</span>':'');
 tdl.innerHTML=TP.list||'<span class="k">нечего переносить</span>';
 tdn.textContent=TP.moves.length?'Из корня в папки: '+TP.moves.length+' файл(ов). Страницы .html, .json и служебные файлы (README, index, _config.yml, CNAME, service worker, favicon…) остаются в корне.':'В корне уже порядок — переносить нечего.';
 tdgo.disabled=true;
 if(!TP.moves.length)return;
 /* предпросмотр: читаем текстовые файлы, чтобы заранее показать, какие ссылки исправятся и что придётся проверить руками */
 const P=TP,txt=tree.filter(e=>e.type==='blob'&&TXF.test(e.path)&&e.size<=1048576).slice(0,600);
 P.texts=new Map();let k=0,done=0;
 const work=async()=>{while(k<txt.length){const e=txt[k++];
  try{const j=await gh('/repos/'+r.full_name+'/git/blobs/'+e.sha);
   P.texts.set(e.path,{e,t:new TextDecoder('utf-8',{fatal:true,ignoreBOM:true}).decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0)))});
  }catch(_){}
  done++;if(TP===P)tds.textContent='Проверяю ссылки: '+done+' / '+txt.length;}};
 await Promise.all([work(),work(),work(),work()]);
 if(TP!==P||cur!==i)return;
 tidyCompute();
}
/* что изменится в файлах при текущих галочках */
function tidyCompute(){
 const P=TP;if(!P||!P.texts)return;
 const map=new Map(P.moves.map(m=>[m.from,m.to])),have=new Set(tree.filter(e=>e.type==='blob').map(e=>e.path));
 const pretty=P.jek&&[...P.texts].some(([p,x])=>/^_config\.ya?ml$/.test(p)&&/^permalink\s*:\s*pretty/m.test(x.t));
 const exts=[...new Set(P.moves.map(m=>ext(m.from)))].join('|');
 const dyn=new RegExp('[\'"`]\\.('+exts+')[\'"`]|\\}\\.('+exts+')\\b','i');
 P.changes=new Map();P.links=0;P.warn=[];
 for(const[path,{e,t}]of P.texts){
  const np=map.get(path)||path;let out=t;
  if($('tdk').checked){const r=relink(t,path,np,map,have,/\.ya?ml$/i.test(path));if(r.n){out=r.out;P.links+=r.n;}}
  if(P.jek&&$('tdj').checked&&map.has(path)&&/\.(md|markdown)$/i.test(path)){
   const stem=path.replace(/\.[^.]+$/,'');out=addPermalink(out,pretty?'/'+stem+'/':'/'+stem+'.html');
  }
  if(out!==t)P.changes.set(path,{e,t:out});
  if(dyn.test(t))P.warn.push(path);
 }
 tds.textContent='';
 tdn.textContent='Из корня в папки: '+P.moves.length+' файл(ов), одним коммитом в ветку '+repos[cur].default_branch+'. Будет исправлено ссылок: '+P.links+', изменится файлов: '+P.changes.size+'. Страницы .html, .json и служебные файлы остаются в корне.';
 tdl.innerHTML=P.list+(P.warn.length?'\n<span class="k">проверь вручную — эти файлы сами собирают пути (например имя + \'.md\'), их ссылки не исправить автоматически:\n'+P.warn.map(x=>'  '+esc(x)).join('\n')+'</span>':'');
 tdgo.disabled=false;
}
$('tdk').onchange=$('tdj').onchange=tidyCompute;
function closeTidy(){tidyOn=false;td.hidden=true;TP=null;applyPend();}
async function runTidy(){
 const r=repos[cur],P=TP,i=cur;if(!P||!P.changes)return;
 tdgo.disabled=true;$('tdx').disabled=true;
 const st=t=>tds.textContent=t;
 try{
  const base='/repos/'+r.full_name+'/git/',br=encodeURIComponent(r.default_branch);
  st('Проверяю ветку…');
  const ref=await gh(base+'ref/heads/'+br,{cache:'no-cache'});
  if(ref.object.sha!==head)throw new Error('в репозитории появились новые коммиты — закрой окно и открой снова');
  const ents=[],moved=new Map(P.moves.map(m=>[m.from,Object.assign({},m)]));
  let n=0;
  for(const[path,{e,t}]of P.changes){
   st('Загружаю изменённые файлы: '+(++n)+' / '+P.changes.size);
   const b=await gh(base+'blobs',{method:'POST',body:{content:t,encoding:'utf-8'}});
   if(moved.has(path))moved.get(path).sha=b.sha;else ents.push({path,mode:e.mode,type:'blob',sha:b.sha});
  }
  for(const m of moved.values()){ents.push({path:m.to,mode:m.e.mode,type:'blob',sha:m.sha||m.e.sha});ents.push({path:m.from,mode:m.e.mode,type:'blob',sha:null});}
  st('Создаю коммит…');
  const c0=await gh(base+'commits/'+ref.object.sha);
  const nt=await gh(base+'trees',{method:'POST',body:{base_tree:c0.tree.sha,tree:ents}});
  const cm=await gh(base+'commits',{method:'POST',body:{message:'Порядок в корне: '+P.moves.length+' файл(ов) разложено по папкам'+(P.links?', исправлено ссылок: '+P.links:'')+' (cyr)',tree:nt.sha,parents:[ref.object.sha]}});
  await gh(base+'refs/heads/'+br,{method:'PATCH',body:{sha:cm.sha,force:false}});
  st('Готово: коммит '+cm.sha.slice(0,7)+'. Перенесено '+P.moves.length+', исправлено ссылок: '+P.links+'.');
  $('tdx').disabled=false;$('tdx').textContent='Закрыть';TP=null;
  if(cur===i)loadServer(i);
 }catch(e){st('Не получилось: '+(e.msg||e.message)+(e.message==='403'||e.message==='404'?' (у токена нет права записи в этот репозиторий?)':''));$('tdx').disabled=false;tdgo.disabled=false;}
}
$('tdy').onclick=openTidy;
$('tdx').onclick=closeTidy;
tdgo.onclick=runTidy;
td.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('tdx').disabled){e.stopPropagation();$('tdx').onclick();}});
/* ---- переключатель WebGPU: canvas нельзя перевести между webgl и webgpu на лету, поэтому выбор запоминается и страница перезагружается ---- */
const gp=$('gp'),gps=$('gps'),GPU_OK=!!navigator.gpu&&window.isSecureContext,isGpu=R.name==='WebGPU';
gp.textContent=isGpu?'WebGPU: вкл':'Включить WebGPU';
gp.setAttribute('aria-pressed',isGpu);
gps.textContent=isGpu?'Рендер: WebGPU'+(R.label?' ('+R.label+')':'')
 :gpuErr?'WebGPU не завёлся: '+gpuErr+'. Рендер: WebGL'
 :GPU_OK?'Рендер: WebGL':'Браузер без WebGPU (нужен Chrome/Edge 113+, Safari 26+, Firefox 141+; в Chrome на Linux/Android может понадобиться chrome://flags/#enable-unsafe-webgpu). Рендер: WebGL';
gp.onclick=()=>{
 if(!isGpu&&!GPU_OK){gps.textContent='WebGPU недоступен в этом браузере: '+(window.isSecureContext?'нет navigator.gpu':'нужен https')+'. Рендер: WebGL';return;}
 if(!leaveOk())return;
 if(isGpu)localStorage.removeItem('cyr_gpu');else localStorage.setItem('cyr_gpu','1');
 location.reload();
};
$('lo').onclick=()=>{if(!leaveOk())return;sessionStorage.removeItem('cyr_token');location.replace('index.html');};
build();loadRepos();

/* ---- цикл (при открытом планшете на весь экран или редакторе сцена не рисуется) ---- */
(function loop(){
 if(!fs&&!edOn){
  resize();
  dr.forEach((d,i)=>{
   d.a+=((i===od?1:0)-d.a)*.14;
   for(let L=1;L<MAXLV;L++)d.nl[L]+=(((i===od&&L<=lv)?1:0)-d.nl[L])*.12;
  });
  items.forEach((it,i)=>{if(it.type==='sata')it.op+=((i===sOpen?1:0)-it.op)*.1;it.y+=((i===sel?.3:0)-it.y)*.18;it.ps+=(it.pt-it.ps)*.07;if(Math.abs(it.pt-it.ps)<.002)it.ps=it.pt;});
  const tg2=outId>=0?{x:STX,y:3.6,z:0,H:3.7,W:4,e:.4}:od<0?{x:0,y:4.8,z:0,H:5.8,W:ncol*3+1.1,e:.45}:sOpen>=0?(p=>({x:p[0],y:p[1],z:p[2],H:1.55,W:1.9,e:1.05}))(sataOpenPos(items[sOpen])):{x:cxOf(dr[od]),y:dr[od].yc-.1,z:3+lv*NEST,H:2.9,W:3.3,e:.95};
  for(const k in tg2)cam[k]+=(tg2[k]-cam[k])*.1;
  draw(false);place();
  if(outId>=0&&!edDone&&items[outId].ps>.985){edDone=true;openEd();}
  if(pend)applyPend();
 }
 requestAnimationFrame(loop);
})();
})();
